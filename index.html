<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi tặng cậu...</title>
    <style>
        /* CSS reset cơ bản */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000; /* Màn hình đen */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Ẩn thanh cuộn */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 1s ease;
        }

        /* Vùng chứa phần Intro */
        #intro-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease-in-out;
        }

        /* Chữ chạy từng dòng */
        #text-display {
            font-size: 1.8rem;
            font-weight: 300;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            padding: 0 20px;
            letter-spacing: 1px;
        }

        /* Màn hình hiển thị Tên và nút Bắt đầu */
        #final-screen {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: none; /* Sẽ được bật bằng JS */
            flex-direction: column;
            align-items: center;
        }

        #receiver-name {
            font-size: 5rem; /* Tên hiển thị cực lớn */
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

        /* Vùng chứa Website chính (Ẩn lúc đầu) */
        #main-content {
            opacity: 0;
            display: none;
            width: 100%;
            height: 100%;
            background-color: #fff; /* Nền của website chính */
            color: #333;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
            overflow-y: auto;
        }

        /* -------------------------------------
           BẠN CÓ THỂ VIẾT CSS CHO WEB CHÍNH Ở ĐÂY
           ------------------------------------- */
        .main-title {
            font-size: 3rem;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .main-message {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
        }

    </style>
</head>
<body>

    <!-- PHẦN INTRO MÀN HÌNH ĐEN -->
    <div id="intro-container">
        <div id="text-display"></div>
        
        <div id="final-screen">
            <!-- THAY ĐỔI TÊN NGƯỜI NHẬN Ở ĐÂY -->
            <h1 id="receiver-name">TÊN NGƯỜI NHẬN</h1>
            <button id="start-btn">Bắt đầu</button>
        </div>
    </div>

    <!-- PHẦN WEBSITE SINH NHẬT CHÍNH -->
    <div id="main-content">
        <!-- BẠN THIẾT KẾ GIAO DIỆN CHÍNH CỦA WEBSITE VÀO ĐÂY -->
        <h1 class="main-title">Chúc Mừng Sinh Nhật! 🎉</h1>
        <p class="main-message">
            Đây là không gian dành cho website sinh nhật chính của bạn. 
            Bạn có thể chèn thêm ảnh, video, nhạc hoặc những lời chúc dài hơn ở dưới này nhé!
        </p>
    </div>

    <!-- SCRIPT CHẠY HIỆU ỨNG -->
    <script>
        // Kịch bản các dòng chữ
        const texts = [
            "Xin chào...",
            "Nếu bạn đang đọc được dòng này...",
            "Có lẽ mình đã chuẩn bị điều này khá lâu.",
            "Tặng riêng cho..."
        ];

        const textDisplay = document.getElementById('text-display');
        const finalScreen = document.getElementById('final-screen');
        const introContainer = document.getElementById('intro-container');
        const mainContent = document.getElementById('main-content');
        const startBtn = document.getElementById('start-btn');

        let currentIndex = 0;

        function showNextText() {
            if (currentIndex < texts.length) {
                // Hiển thị nội dung chữ
                textDisplay.textContent = texts[currentIndex];
                // Fade in
                textDisplay.style.opacity = 1;
                
                // Đợi 2.5s rồi Fade out
                setTimeout(() => {
                    textDisplay.style.opacity = 0;
                    currentIndex++;
                    
                    // Đợi 1s cho chữ mờ hẳn rồi mới gọi dòng tiếp theo
                    setTimeout(showNextText, 1000); 
                }, 2500); 
            } else {
                // Đã chạy hết mảng chữ, ẩn thẻ hiển thị chữ đi
                textDisplay.style.display = 'none';
                
                // Hiển thị màn hình có TÊN và NÚT BẤM
                finalScreen.style.display = 'flex';
                // Delay 1 xíu để CSS nhận diện display: flex trước khi chạy transition opacity
                setTimeout(() => {
                    finalScreen.style.opacity = 1;
                }, 100);
            }
        }

        // Bắt đầu chạy hiệu ứng sau khi trang web load 1 giây
        setTimeout(showNextText, 1000);

        // Sự kiện khi bấm nút "Bắt đầu"
        startBtn.addEventListener('click', () => {
            // Fade out toàn bộ màn hình intro
            introContainer.style.opacity = 0;
            
            setTimeout(() => {
                introContainer.style.display = 'none'; // Ẩn hẳn màn hình intro
                
                // Hiện giao diện Website Chính
                document.body.style.backgroundColor = "#fff"; // Đổi nền body thành trắng
                mainContent.style.display = 'flex';
                
                setTimeout(() => {
                    mainContent.style.opacity = 1; // Fade in giao diện chính
                }, 100);

            }, 1000); // Chờ 1s cho intro mờ hẳn
        });
    </script>
</body>
</html>
