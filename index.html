<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>For Someone Special ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:
radial-gradient(circle at top,#1f1f3f,#090914);

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

color:white;

}

/* Stars */

.star{

position:absolute;

width:2px;
height:2px;

background:white;

border-radius:50%;

animation:blink 2s infinite;

}

@keyframes blink{

50%{

opacity:.2;

}

}

.container{

text-align:center;

z-index:10;

}

/* Envelope */

.envelope{

margin:auto;

width:180px;
height:120px;

background:#fff;

position:relative;

cursor:pointer;

transition:.5s;

border-radius:6px;

box-shadow:0 20px 50px rgba(0,0,0,.4);

}

.envelope:hover{

transform:translateY(-10px);

}

.envelope:before{

content:"";

position:absolute;

border-left:90px solid transparent;
border-right:90px solid transparent;
border-top:60px solid #f2dede;

top:0;

left:0;

transform-origin:top;

transition:.8s;

}

.open:before{

transform:rotateX(180deg);

}

.letter{

position:absolute;

left:10px;
right:10px;
bottom:10px;

height:90px;

background:white;

padding:15px;

border-radius:5px;

color:#444;

transform:translateY(0);

transition:.8s;

overflow:hidden;

}

.open .letter{

transform:translateY(-90px);

height:300px;

}

h1{

margin-bottom:30px;

font-weight:300;

letter-spacing:2px;

}

#typing{

margin-top:15px;

font-size:18px;

line-height:1.8;

white-space:pre-line;

}

button{

margin-top:30px;

padding:15px 35px;

border:none;

border-radius:40px;

background:#ff4f81;

color:white;

font-size:18px;

cursor:pointer;

display:none;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

</style>

</head>

<body>

<div class="container">

<h1>✨ Bạn có một bức thư chưa được mở...</h1>

<div class="envelope" onclick="openLetter()" id="env">

<div class="letter">

<div id="typing"></div>

</div>

</div>

<button id="next">

Tiếp tục 🎂

</button>

</div>

<script>

// Stars

for(let i=0;i<150;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(s);

}

const text=`Xin chào...

Có lẽ bạn đang tự hỏi
vì sao mình lại tạo ra website này.

Thật ra...

Đây không đơn giản là
một lời chúc sinh nhật.

Mình chỉ muốn cảm ơn
vì đã xuất hiện trong cuộc đời mình.

❤️`;

let i=0;

function openLetter(){

document.getElementById("env").classList.add("open");

typing();

}

function typing(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,40);

}else{

document.getElementById("next").style.display="inline-block";

}

}

</script>

</body>

</html>
